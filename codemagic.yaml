# Configure signing and the App Store Connect integration as documented in
# mobile/docs/codemagic.md. Workflows are started manually in Codemagic.
workflows:
  ios-simulator:
    name: iOS simulator - real conversion core
    instance_type: mac_mini_m2
    max_build_duration: 120
    working_directory: mobile/app
    environment:
      flutter: 3.38.7
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/stl2stp-ios-deps/V8.0.1.tar.gz
    scripts:
      - name: Record toolchain and validate C API
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          for tool in cmake ninja; do command -v "$tool" >/dev/null || HOMEBREW_NO_AUTO_UPDATE=1 brew install "$tool"; done
          git log -1 --format="Build commit: %H %s"
          flutter --version
          xcodebuild -version
          python3 tool/ios/core_symbols.py
          python3 tool/ios/test_core_symbols.py
          python3 tool/ios/test_build_ios_core.py
          python3 tool/ios/test_check_ios_binary.py
          python3 ../tools/tests/test_occt_discovery.py
      - name: Flutter packages, analysis and tests
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test
      - name: Build OCCT and the real iOS core
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          SIM_ARCHS=arm64 JOBS=4 bash tool/ios/build_ios_core.sh
      - name: Install CocoaPods dependencies
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          cd ios
          pod install
      - name: Build and check the simulator app
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/mobile/build"
          {
            git log -1 --format="Build commit: %H %s"
            cat ios/Flutter/Stl2StpCore.xcconfig
            xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
              -configuration Debug -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' -showBuildSettings | \
              sed -n -E '/^[[:space:]]*(ARCHS|CURRENT_ARCH|ONLY_ACTIVE_ARCH|EXCLUDED_ARCHS|STL2STP_CORE_LIBRARY|OTHER_LDFLAGS|ENABLE_DEBUG_DYLIB|SDKROOT|PLATFORM_NAME|NATIVE_ARCH_ACTUAL) = /p'
          } 2>&1 | tee "$CM_BUILD_DIR/mobile/build/ios-simulator-link-settings.log"
          flutter build ios --simulator --debug --verbose 2>&1 | \
            tee "$CM_BUILD_DIR/mobile/build/ios-simulator-build.log"
          python3 tool/ios/check_ios_binary.py build/ios/iphonesimulator/Runner.app/Runner
          mkdir -p "$CM_BUILD_DIR/mobile/build"
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app \
            "$CM_BUILD_DIR/mobile/build/stl2stp-ios-simulator.zip"
    artifacts:
      - $CM_BUILD_DIR/mobile/build/stl2stp-ios-simulator.zip
      - $CM_BUILD_DIR/mobile/build/ios-simulator-*.log
      - /tmp/xcodebuild_logs/*.log

  ios-testflight:
    name: iOS signed release - TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120
    working_directory: mobile/app
    integrations:
      app_store_connect: stl2stp-app-store-connect
    environment:
      flutter: 3.38.7
      xcode: latest
      cocoapods: default
      groups:
        - ios_release
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.stl2stp.stl2stpApp
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/stl2stp-ios-deps/V8.0.1.tar.gz
    scripts:
      - name: Validate release inputs and toolchain
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          : "${APP_STORE_APPLE_ID:?Set the numeric Apple ID in the ios_release variable group}"
          [[ "$APP_STORE_APPLE_ID" =~ ^[0-9]+$ ]] || { echo 'APP_STORE_APPLE_ID must be numeric' >&2; exit 1; }
          : "${PROJECT_BUILD_NUMBER:?Codemagic must provide PROJECT_BUILD_NUMBER}"
          [[ "$PROJECT_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo 'PROJECT_BUILD_NUMBER must be a positive integer' >&2; exit 1; }
          for tool in cmake ninja; do command -v "$tool" >/dev/null || HOMEBREW_NO_AUTO_UPDATE=1 brew install "$tool"; done
          git log -1 --format="Build commit: %H %s"
          flutter --version
          xcodebuild -version
          python3 tool/ios/core_symbols.py
          python3 tool/ios/test_core_symbols.py
          python3 tool/ios/test_build_ios_core.py
          python3 tool/ios/test_check_ios_binary.py
          python3 ../tools/tests/test_occt_discovery.py
      - name: Flutter packages, analysis and tests
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test
      - name: Build OCCT and the real iOS core
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          SIM_ARCHS=arm64 JOBS=4 bash tool/ios/build_ios_core.sh
      - name: Install pods and apply signing profiles
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          (cd ios && pod install)
          xcode-project use-profiles
      - name: Archive signed IPA and validate exported C API
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          # This counter also exists before the first App Store Connect upload.
          echo "Building IPA with Codemagic project build number: $PROJECT_BUILD_NUMBER"
          flutter build ipa --release --build-number="$PROJECT_BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
          python3 tool/ios/check_ios_binary.py build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app/Runner
    artifacts:
      - $CM_BUILD_DIR/mobile/app/build/ios/ipa/*.ipa
      - $CM_BUILD_DIR/mobile/app/build/ios/archive/*.xcarchive/dSYMs/*.dSYM
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
